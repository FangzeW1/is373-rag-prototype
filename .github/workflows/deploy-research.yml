name: Deploy RAG Research Site

on:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - '.github/workflows/deploy-research.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: research/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: research

      - name: Build VitePress
        run: npm run build
        working-directory: research

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: research/.vitepress/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
